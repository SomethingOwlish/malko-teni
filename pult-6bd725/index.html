<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Пульт Малкавиан</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Forum&display=swap">
<style>
:root{--bg:#141216;--panel:#1e1b21;--line:#34303a;--ink:#e9e4ee;--muted:#9a93a3;--acc:#b98cff;--ok:#7fd49a;--bad:#ff8a7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'PT Sans',sans-serif}
.top{position:sticky;top:0;z-index:5;background:rgba(20,18,22,.96);border-bottom:1px solid var(--line);padding:10px 16px}
.top .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font:400 24px Forum,serif;margin:0 auto 0 0;letter-spacing:.04em}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.btn{font:inherit;border:1px solid var(--acc);background:var(--acc);color:#1a1020;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--acc)}
.status{font-size:14px;color:var(--muted);width:100%}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
details.set{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
details.set summary{cursor:pointer;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
label{display:block;color:var(--muted);font-size:13px;margin:8px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:#151318;border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{resize:vertical}
input[type=checkbox]{display:inline;width:auto;margin:0 6px 0 0;accent-color:var(--acc)}
.chk{display:inline-flex;align-items:center;color:var(--ink);font-size:14px;margin:4px 0}
.chk.big{font-weight:700;white-space:nowrap}
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#tabs button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;text-align:left}
#tabs button small{display:block;color:var(--muted);font-size:12px}
#tabs button.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.box h2{font:400 21px Forum,serif;margin:0 0 8px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:120px 1fr;gap:12px;border-top:1px solid var(--line);padding:12px 0;opacity:.62}
.item.on{opacity:1}.item.on .ititle b{color:var(--acc)}
.ititle{margin-bottom:4px}.icard{font-size:15px}
.iopts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;margin-top:6px}
.iopts input[type=url]{margin:0}.iopts details{grid-column:1/-1;color:var(--muted)}
.ftext{white-space:pre-wrap;font-size:14px;color:var(--ink);background:#151318;border-radius:6px;padding:10px;margin-top:6px;max-height:320px;overflow:auto}
.pill{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--muted)}.pill.g{border-color:var(--ok);color:var(--ok)}
.extra{border-top:1px solid var(--line);padding:10px 0}
.row.link{display:grid;grid-template-columns:140px 1fr 2fr;gap:10px;align-items:center;margin:6px 0}
.row.link input{margin:0}
.muted{color:var(--muted)}.urls{padding-left:18px}.urls a{color:var(--acc);word-break:break-all}
@media (max-width:700px){.grid2,.grid4,.row.link{grid-template-columns:1fr}.item{grid-template-columns:1fr}.iopts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <h1>Пульт · Малкавиан</h1>
  <button class="btn ghost" id="reload">Перечитать с сайта</button>
  <button class="btn" id="publish">Опубликовать</button>
  <div id="status" class="status"></div>
</div></div>
<div class="wrap">
  <details class="set"><summary>Настройки: GitHub и библиотека текстов</summary>
    <div class="grid4">
      <label>Владелец (логин)<input id="gh-owner" placeholder="argentum"></label>
      <label>Репозиторий<input id="gh-repo" placeholder="malk-cards"></label>
      <label>Ветка<input id="gh-branch" placeholder="main"></label>
      <label>Токен (fine-grained, Contents: write)<input id="gh-token" type="password" placeholder="github_pat_…"></label>
    </div>
    <label>Библиотека текстов (library.json — хранится только у тебя)<input id="libfile" type="file" accept=".json,application/json"></label>
    <p class="muted" id="libstate"></p>
    <p class="muted">Токен и библиотека сохраняются только в этом браузере. <button class="btn ghost" id="forget">Забыть всё на этом устройстве</button></p>
  </details>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>
<script>window.MALK_PLAYERS = [{"id": "grek", "slug": "codex-d46e", "voice": "euthymius", "title": "Грек"}, {"id": "velen", "slug": "most-0996", "voice": "lane", "title": "Велен"}, {"id": "alisa", "slug": "bosoy-836b", "voice": "prokhor", "title": "Алиса"}, {"id": "vorobeika", "slug": "hortus-880c", "voice": "ashme", "title": "Воробейка"}, {"id": "fifth", "slug": "processus-b335", "voice": "tommazo", "title": "Пятый"}];</script>
<script src="../assets/cms.js"></script>
</body>
</html>
